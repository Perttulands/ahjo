[package]
name = "ahjo-term"
version = "0.0.1"
edition = "2024"
license = "MIT"
description = "Ahjo's terminal engine and session backends."
publish = false

[lints]
workspace = true

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "io-util", "sync", "time"] }
vt100 = "=0.18.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
ahjo-holder = { path = "../holder" }
serde_json = "1"

[dev-dependencies]
ahjo-testkit = { path = "../../kit/testkit" }
vt100-upstream = { package = "vt100", git = "https://github.com/doy/vt100-rust.git", rev = "fb0f54ec7222f4805f33cd3ca530229e0a0fe6ad" }
