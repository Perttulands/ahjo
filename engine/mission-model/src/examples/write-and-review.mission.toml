schema = 6
id = "msn_example"
slug = "write-and-review"
title = "Write and review"
rev = 1

[[input_card]]
id = "inp_task"
title = "Task"
goal = "A writer does the work in its own session and a reviewer sends it back until it is right, at most three times."
inputs = [
  { name = "brief", kind = "text", required = true, description = "What to write or change, and for whom." },
]
outputs = [{ name = "result", description = "The work the reviewer passed.", kind = "text", required = false, from = "fmn_write:port_write_out" }]

[[step]]
id = "fmn_write"
formation = "solo"
title = "Write"
[step.brief]
goal = "Do this work in the run's folder:\n\n{brief}\n\nWhen the reviewer sent it back, its reason arrives on your input: fix that. Return what you changed and where on your output."
[[step.input]]
id = "port_write_in"
label = "Brief"
[[step.output]]
id = "port_write_out"
label = "Draft"
[[step.seat]]
id = "seat_write"
label = "Writer"
harness = "claude-code"
effort = "medium"

[[step]]
id = "fmn_review"
formation = "solo"
title = "Review"
[step.brief]
goal = "Review the draft on your input against this work:\n\n{brief}\n\nRead what changed. Pass it when it is correct and clear; fail it with the specific changes it needs."
[[step.input]]
id = "port_review_in"
label = "Draft"
[[step.output]]
id = "port_review_out"
label = "Verdict"
[[step.seat]]
id = "seat_review"
label = "Reviewer"
harness = "claude-code"
effort = "high"

[[gate]]
id = "gate_review"
title = "Reviewed"
kinds = ["step"]
criterion = "The draft does what the brief asks, correctly and clearly."

[[limit]]
id = "lim_rounds"
title = "Three rounds"
scope = "fmn_write"
rounds = 3
when_spent = "fail"

[[end]]
id = "end_done"
title = "Done"
outcome = "done"

[[connection]]
id = "edge_task"
from = "inp_task:out"
to = "fmn_write:port_write_in"

[[connection]]
id = "edge_draft"
from = "fmn_write:port_write_out"
to = "gate_review:in"

[[connection]]
id = "edge_judge_start"
from = "gate_review:judge"
to = "fmn_review:port_review_in"

[[connection]]
id = "edge_judge_return"
from = "fmn_review:port_review_out"
to = "gate_review:judge"

[[connection]]
id = "edge_back"
from = "gate_review:fail"
to = "fmn_write:port_write_in"

[[connection]]
id = "edge_done"
from = "gate_review:pass"
to = "end_done:in"
