[package]
name = "ahjo-mission-engine"
version = "0.0.1"
edition = "2024"
license = "MIT"
description = "Ahjo's mission engine: its store, its validation and its runs."
repository = "https://github.com/Perttulands/ahjo"
publish = false

[dependencies]
ahjo-mission-model = { path = "../mission-model" }
ahjo-core = { path = "../../kit/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
toml_edit = { version = "0.25", features = ["serde"] }
sha2 = "0.11"
hex = "0.4"
getrandom = "0.4"
libc = "0.2"
time = { version = "0.3", features = ["formatting", "parsing"] }
ahjo-term = { path = "../term" }
ahjo-issue-ref = { path = "../issue-ref" }
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[lints]
workspace = true

[dev-dependencies]
anyhow = "1"
tokio = { version = "1", features = ["full"] }
ahjo-missions = { path = "../../areas/missions/node" }
ahjo-terminals = { path = "../../areas/terminals/node" }
ahjo-issue = { path = "../../areas/issue/node" }
ahjo-node-kit = { path = "../../kit/node-kit" }
ahjo-testkit = { path = "../../kit/testkit" }
