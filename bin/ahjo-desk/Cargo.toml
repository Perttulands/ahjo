[package]
name = "ahjo-app-desk"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Ahjo Desk: the shared surface where agents publish and the operator answers in his words and marks, in its own window, over the decision desk's HTTP API."
publish = false

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "ahjo-desk"
path = "src/main.rs"

[dependencies]
ahjo-app-kit = { path = "../../kit/app-kit" }
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "macros"] }
# H.264 in MP4, decoded in the app so video needs nothing installed: the
# decoder is built from its C++ source by the build (`cc`).
openh264 = "0.9"
mp4 = "0.14"
time = { version = "0.3", features = ["parsing", "formatting"] }
image = { version = "0.25", default-features = false }
async-channel = "2"
log = "0.4"

# A published page renders inside the window on Windows, in WebView2 (part
# of Windows), laid over the surface as a child window.
[target.'cfg(windows)'.dependencies]
wry = { version = "0.57", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["x11"] }

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.12", features = ["test-support"] }
