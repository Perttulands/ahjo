[package]
name = "ahjo-app-swarm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Ahjo Swarm, the native app: the shell in a window, holding the pages areas register."
publish = false

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "ahjo-swarm"
path = "src/main.rs"

[dependencies]
ahjo-app-kit = { path = "../../kit/app-kit" }
ahjo-app-shell = { path = "../../kit/app-shell" }
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12" }
log = "0.4"
# The pages, one line each, as in PAGES.
ahjo-agents-app = { path = "../../areas/agents/app" }
ahjo-terminals-app = { path = "../../areas/terminals/app" }
ahjo-scheduled-app = { path = "../../areas/scheduled/app" }
ahjo-files-app = { path = "../../areas/files/app" }
ahjo-host-app = { path = "../../areas/host/app" }
ahjo-work-app = { path = "../../areas/work/app" }
ahjo-missions-app = { path = "../../areas/missions/app" }

# Linux builds are for testing on an invisible X display; the product is Windows.
[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["x11"] }

[build-dependencies]
# gpui builds the same version for its own Windows resource.
embed-resource = "3"

[dev-dependencies]
async-channel = "2"
gpui = { package = "gpui-pre", version = "=0.3.12", features = ["test-support"] }
serde_json = "1"
