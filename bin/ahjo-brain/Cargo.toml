[package]
name = "ahjo-app-brain"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Ahjo Brain: the company brain as a night sky, with search that moves you through it and a reader."
publish = false

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "ahjo-brain"
path = "src/main.rs"

[dependencies]
ahjo-app-kit = { path = "../../kit/app-kit" }
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["local-offset"] }

# Linux builds are for testing on an invisible X display; the product is Windows.
[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["x11"] }

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.12", features = ["test-support"] }
