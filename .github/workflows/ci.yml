name: CI
on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: cargo fmt --check
      # The app crates (the kit's ahjo-app-kit and ahjo-app-shell, the apps
      # ahjo-app-swarm, ahjo-app-brain and ahjo-app-desk, and every area's
      # ahjo-<area>-app) have their own job, with the GUI toolkit's
      # libraries; a new area's app crate needs no edit here.
      - run: cargo clippy --workspace --exclude 'ahjo-app*' --exclude 'ahjo-*-app' --all-targets -- -D warnings
      - run: cargo test --workspace --exclude 'ahjo-app*' --exclude 'ahjo-*-app'
        env:
          AHJO_REQUIRE_TMUX: "1"

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # gpui's X11 platform and its font stack; the tests draw on gpui's
      # test platform and need no display. The page tests drive tmux.
      - run: >
          sudo apt-get update && sudo apt-get install -y tmux pkg-config
          libxcb1-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev
          libwayland-dev libfontconfig1-dev libfreetype-dev
      - run: cargo clippy -p 'ahjo-app*' -p 'ahjo-*-app' --all-targets -- -D warnings
      - run: cargo test -p 'ahjo-app*' -p 'ahjo-*-app'
        env:
          AHJO_REQUIRE_TMUX: "1"

  # The Windows session holder: its tests are `#![cfg(windows)]` and run only
  # here. PowerShell 7 is on the runner image.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p ahjo-holder --all-targets -- -D warnings
      - run: cargo test -p ahjo-holder
