[package]
name = "ahjo-app-kit"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "What an app area plugs into: tokens, widgets, the node link, Host and Page."
publish = false

[lints]
workspace = true

[dependencies]
ahjo-core = { path = "../core" }
gpui = { package = "gpui-pre", version = "=0.3.12" }
async-channel = "2"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
log = "0.4"
notify = "8"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["local-offset"] }
tokio = { version = "1", features = ["rt", "net", "sync", "macros", "time", "io-util"] }
tokio-tungstenite = "0.30"
unicode-segmentation = "1"

# A web page laid inside the window on Windows, in WebView2 (part of
# Windows), as a child window (`web_view`).
[target.'cfg(windows)'.dependencies]
wry = { version = "0.57", default-features = false }
raw-window-handle = "0.6"

[dev-dependencies]
ahjo-testkit = { path = "../testkit", features = ["app"] }
gpui = { package = "gpui-pre", version = "=0.3.12", features = ["test-support"] }
tempfile = "3"
