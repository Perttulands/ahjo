[package]
name = "ahjo-brain-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
ahjo-brain-contract = { path = "../contract" }
ahjo-core = { path = "../../../kit/core" }
ahjo-app-kit = { path = "../../../kit/app-kit" }
gpui = { package = "gpui-pre", version = "=0.3.12" }
jiff = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
[dev-dependencies]
ahjo-terminals = { path = "../../terminals/node" }
ahjo-terminals-app = { path = "../../terminals/app" }
axum = { version = "0.8", features = ["json", "tokio", "http1"] }
ahjo-app-shell = { path = "../../../kit/app-shell" }
ahjo-brain = { path = "../node" }
ahjo-testkit = { path = "../../../kit/testkit", features = ["app"] }
gpui = { package = "gpui-pre", version = "=0.3.12", features = ["test-support"] }
tokio = { version = "1", features = ["full"] }
