[package]
name = "ahjo-scheduled-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
ahjo-app-kit = { path = "../../../kit/app-kit" }
ahjo-core = { path = "../../../kit/core" }
ahjo-scheduled-contract = { path = "../contract" }
# The sessions a task may send to, as the Sessions page publishes them.
ahjo-terminals-contract = { path = "../../terminals/contract" }
gpui = { package = "gpui-pre", version = "=0.3.12" }
jiff = { version = "0.2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Globalization", "Win32_System_Time"] }

[dev-dependencies]
ahjo-app-shell = { path = "../../../kit/app-shell" }
ahjo-scheduled = { path = "../node" }
ahjo-terminals = { path = "../../terminals/node" }
ahjo-testkit = { path = "../../../kit/testkit", features = ["app"] }
ahjo-node-kit = { path = "../../../kit/node-kit" }
gpui = { package = "gpui-pre", version = "=0.3.12", features = ["test-support"] }
tokio = { version = "1", features = ["full"] }
