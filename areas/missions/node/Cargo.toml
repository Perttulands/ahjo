[package]
name = "ahjo-missions"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["json"] }
ahjo-core = { path = "../../../kit/core" }
ahjo-node-kit = { path = "../../../kit/node-kit" }
ahjo-term = { path = "../../../engine/term" }
ahjo-mission-engine = { path = "../../../engine/missions" }
ahjo-work-contract = { path = "../../work/contract" }
ahjo-missions-contract = { path = "../contract" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
ahjo-testkit = { path = "../../../kit/testkit" }
tower = { version = "0.5", features = ["util"] }

ahjo-work = { path = "../../work/node" }
futures-util = "0.3"
tokio-tungstenite = "0.29"
ahjo-agents = { path = "../../agents/node" }
