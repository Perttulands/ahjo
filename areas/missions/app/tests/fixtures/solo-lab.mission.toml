[[step.output]]
id = "port_out"
label = "Result"
[[step.seat]]
id = "seat_work"
label = "Worker"
agent = "builder"
harness = "openai-codex"
model = "" # harness default
effort = "medium"

[[end]]
id = "end_done"
title = "Done"
outcome = "done"

[[connection]]
id = "edge_start"
from = "inp_hello:out"
to = "fmn_work:port_in"

[[connection]]
id = "edge_done"
from = "fmn_work:port_out"
to = "end_done:in"
