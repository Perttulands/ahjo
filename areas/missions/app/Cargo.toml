[package]
name = "ahjo-missions-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
ahjo-app-kit = { path = "../../../kit/app-kit" }
ahjo-core = { path = "../../../kit/core" }
ahjo-missions-contract = { path = "../contract" }
ahjo-agents-contract = { path = "../../agents/contract" }
gpui = { package = "gpui-pre", version = "=0.3.12" }
serde_json = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["local-offset", "parsing"] }

[dev-dependencies]
axum = { version = "0.8", default-features = false }
anyhow = "1"
http = "1"
ahjo-app-shell = { path = "../../../kit/app-shell" }
ahjo-missions = { path = "../node" }
ahjo-work = { path = "../../work/node" }
ahjo-files = { path = "../../files/node" }
ahjo-testkit = { path = "../../../kit/testkit" }
ahjo-node-kit = { path = "../../../kit/node-kit" }
gpui = { package = "gpui-pre", version = "=0.3.12", features = ["test-support"] }
tokio = { version = "1", features = ["full"] }
ahjo-mission-engine = { path = "../../../engine/missions" }
ahjo-term = { path = "../../../engine/term" }
