[package]
name = "ahjo-terminals"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
ahjo-core = { path = "../../../kit/core" }
ahjo-node-kit = { path = "../../../kit/node-kit" }
ahjo-term = { path = "../../../engine/term" }
ahjo-terminals-contract = { path = "../contract" }
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }
toml = { version = "1", default-features = false, features = ["parse", "serde", "std", "display"] }

[dev-dependencies]
libc = "0.2"
ahjo-testkit = { path = "../../../kit/testkit" }
vt100 = "=0.18.1"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
tokio-tungstenite = "0.30"
