[package]
name = "ahjo-host-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
ahjo-app-kit = { path = "../../../kit/app-kit" }
ahjo-core = { path = "../../../kit/core" }
ahjo-host-contract = { path = "../contract" }
ahjo-terminals-contract = { path = "../../terminals/contract" }
gpui = { package = "gpui-pre", version = "=0.3.12" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
time = { version = "0.3", features = ["local-offset"] }

[dev-dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
ahjo-node-kit = { path = "../../../kit/node-kit" }
ahjo-app-shell = { path = "../../../kit/app-shell" }
ahjo-host = { path = "../node" }
ahjo-testkit = { path = "../../../kit/testkit" }
gpui = { package = "gpui-pre", version = "=0.3.12", features = ["test-support"] }
tokio = { version = "1", features = ["full"] }
